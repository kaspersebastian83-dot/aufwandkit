:root{
  --bg:#eef4fb; --panel:#ffffff; --panel2:#f4f9fe; --line:#dce8f5; --line2:#c2d6ec; --text:#21303e; --muted:#6b8199;
  --accent:#3f7cc0; --accent-2:#356aa8; --accent-l:#5a93d0; --head:#4179b2; --ok:#2e7d4f; --warn:#9a5b00; --err:#c0392b;
  --focus:#e6f0fb; --on-accent:#fff; --primary:#3f7cc0; --primary-h:#5a93d0; --shadow:0 1px 2px rgba(40,72,116,.05),0 1px 3px rgba(40,72,116,.07);
  --sans:'IBM Plex Sans',"Segoe UI",system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#131b24; --panel:#1a2430; --panel2:#202c3a; --line:#2c3b4d; --line2:#3a4d63; --text:#e3ebf3; --muted:#93a7bc;
    --accent:#6fa3dc; --accent-2:#5a93d0; --accent-l:#8bb8e6; --head:#24476d; --ok:#6cc08a; --warn:#e2b34f; --err:#f07a70; --focus:#1f3247; --primary:#3a73b3; --primary-h:#4a84c4; --shadow:0 1px 3px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:6px 13px}
button:hover{border-color:var(--accent-l);color:var(--accent)}
button.primary{background:var(--primary);border-color:var(--accent-2);color:var(--on-accent);font-weight:600;box-shadow:0 2px 6px rgba(26,74,122,.22)}
button.primary:hover{background:var(--primary-h);color:var(--on-accent)}
button.x{border:0;background:none;color:var(--muted);padding:2px 6px}
.kmzelle{white-space:nowrap}
button.route{border:1px solid var(--line,#d0d5dc);background:none;border-radius:4px;padding:1px 5px;margin-left:4px;font-size:13px;line-height:1.3;cursor:pointer;vertical-align:middle}
button.route.hat{border-color:#2e7d4f;color:#2e7d4f}
#dlg .routeform{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;margin:10px 0}
#dlg .routeform input[type=text],#dlg .routeform input[type=url]{width:100%;min-width:0;box-sizing:border-box}
#dlg .routeform .voll{grid-column:1/-1}
button.x:hover{color:var(--err)}
button.link{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
input[type=text],input[type=search],input[type=date],select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;min-width:0}
textarea{width:100%;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
code,.mono{font-family:var(--mono);font-size:12.5px}
header{position:sticky;top:0;z-index:5}
/* Kopf wie LabelKit/FotoKit: blaue App-Leiste + weiße Werkzeugzeile */
header{background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative;z-index:5}
.appbar{background:var(--head);color:#fff;height:52px;padding:0 20px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.appbar .brand{font-weight:600;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.appbar .brand .hex{font-size:17px;opacity:.9}
.appbar .brand small{font-weight:400;font-size:12px;opacity:.75}
.hbadge{font:500 11px/1 var(--mono);background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:4px;padding:5px 9px;color:#fff;box-shadow:none}
button.hbadge:hover{background:rgba(255,255,255,.26);color:#fff;border-color:rgba(255,255,255,.5)}
.hbadge.help{font-family:var(--sans);font-size:12px;padding:4px 10px}
.hbadge.help b{display:inline-block;width:16px;height:16px;line-height:16px;border-radius:50%;background:#fff;color:var(--head);text-align:center;font-size:11px;margin-right:4px}
.appbar .folder{font:12px var(--mono);color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 20px}
.upd{font-size:12px;padding:4px 10px;background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.upd:hover{color:#fff;background:var(--ok);filter:brightness(1.1)}
.folder{font-family:var(--mono);font-size:13px;color:var(--muted)}

.bar label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.bar #kz{width:74px;text-transform:uppercase;font-family:var(--mono)}
#status{font-size:12.5px;color:var(--muted)}
#status.ok{color:var(--ok)} #status.err{color:var(--err)}
#banner{display:none;padding:8px 20px;font-size:13px}
#banner.show{display:block} #banner.err{background:color-mix(in srgb,var(--err) 12%,var(--panel))}
#support{display:none;background:color-mix(in srgb,var(--err) 12%,var(--panel));padding:10px 20px}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.pjband{display:flex;gap:4px 18px;flex-wrap:wrap;align-items:baseline;margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--panel2);font-size:13px}
.pjband b{font-weight:600}.pjband .k{color:var(--muted)}
.pjband .hint{color:var(--muted);flex-basis:100%;font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs button[role=tab]{border-radius:16px;padding:5px 14px}
.tabs button[aria-selected=true]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.spacer{flex:1}
.karte{background:color-mix(in srgb,var(--panel) 80%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px 18px;margin-bottom:14px}
.karte h2{font-size:17px;margin:0 0 8px}
.karte h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:18px 0 8px}
.kopfzeile{display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.m{color:var(--muted);font-size:12.5px}
.warn{color:var(--warn)}
.ok{color:var(--ok);margin:6px 0 10px}
.zeile{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap}
.zeile label{display:flex;gap:6px;align-items:center;font-size:13px}
label.block{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.leer{max-width:560px;margin:60px auto;text-align:center;color:var(--muted)}
.leer h2{color:var(--text)}
.leer code{background:var(--panel2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;color:var(--text)}
.pliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:10px 0}
.pz{text-align:left}
.pz b{font-family:var(--mono);margin-right:6px}
#pSuche{width:100%;max-width:360px}
.tabwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13.5px}
.r{text-align:right}
table.eing input[type=text],table.eing select{font-size:13px}
select.offen{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel2))}
.hinweise{background:color-mix(in srgb,var(--warn) 9%,var(--panel));border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:8px;padding:8px 14px;font-size:13px;margin:6px 0 12px}
.hinweise ul{margin:4px 0 0;padding-left:20px}
table.abr td{font-size:13.5px}
table.abr tr.titel td{background:color-mix(in srgb,var(--panel2) 75%,transparent);font-weight:600;border-top:2px solid var(--line2)}
table.abr tr.summe td,table.abr tfoot td{font-weight:600}
.quelle{font-size:11.5px;color:var(--muted)}
#dlgBack{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50}
#dlgBack.show{display:flex}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:min(680px,94vw);max-height:90vh;overflow:auto}
#dlg h3{margin:0 0 8px} #dlg td{padding:4px 10px 4px 0;font-size:13px} #dlg .btns{display:flex;justify-content:flex-end;margin-top:10px}
#wasserzeichen{position:fixed;inset:0;z-index:-1;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:.07}
@media (prefers-color-scheme: dark){ #wasserzeichen{opacity:.09} }
@media (max-width:680px){ #wasserzeichen img{width:84vmin} }
#wasserzeichen img{width:min(64vmin,640px);height:auto}
@media print{
  header,#status,#banner,.tabs,.keindruck,#wasserzeichen{display:none!important}
  body{background:#fff;color:#000} main{padding:0;max-width:none} .karte{border:0;box-shadow:none;padding:0}
  .karte:not(.druck){display:none}
}

</style>
</head>

<script>
/* AUFWAND-LOGIK-START */
/* Reine Logik ohne DOM (tests/logik.cjs): Kategorien aus LabelKit, Summen der Zeiten, Positionen, Hinweise, Seitenzahlen.
   Grundsatz: Mengen werden gezählt, nicht geschätzt. Was nicht sicher feststeht (Seitenzahl, Zuordnung), bleibt offen und erscheint als Hinweis. */
const AW = (() => {
  const str = v => v == null ? '' : String(v);
  const t = v => str(v).trim();
  /** Zahl wie eingegeben („7,5“, „38“) → Number; leer → 0; unlesbar → NaN. */
  /* Zahl mit Komma („7,5“) oder Punkt („7.5“). „1.250“ ist mehrdeutig (1250 oder 1,25?) und gilt wie „1.250,00“ als keine Zahl –
     daraus wird ein Hinweis statt eines still falschen Betrags. */
  const zahl = v => { const r = t(v).replace(/\s/g, ''); if (!r) return 0; if (/^-?\d{1,3}(\.\d{3})+$/.test(r)) return NaN; const s = r.replace(',', '.'); return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : NaN; };
  const fmt = (x, st) => { if (x == null || Number.isNaN(x)) return ''; const r = Math.round(x * 100) / 100; const d = st == null ? (Number.isInteger(r) ? 0 : (Number.isInteger(r * 10) ? 1 : 2)) : st;
    return r.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d }); };
  const euro = x => x == null || Number.isNaN(x) ? '' : fmt(x, 2) + ' €';
  /** Kaufmännisch auf Cent runden (0,225 → 0,23). Math.round(x * 100) / 100 rundet wegen der Gleitkommadarstellung
     z. B. 0,3 km × 0,75 € = 0,225 auf 0,22 ab; hier wird über die Dezimaldarstellung gerundet. Gilt auch für Mengen (2 Stellen wie angezeigt). */
  const geld = x => { if (x == null || !Number.isFinite(x)) return x; return Math.sign(x) * Math.round(Number((Math.abs(x) * 100).toFixed(6))) / 100; };

  /* ---------- Einstellungen (Positionskatalog) ----------
     Feste Schlüssel für Zeit, Fahrt und Nebenkosten; Laborpositionen frei („lab-…“). Vorbelegt nach Rechnung 202600542. */
  const TITEL = {
    1: 'Aufsuchen der Schadenstelle mit Probenahme zur Durchführung der erforderlichen chemischen Untersuchungen',
    2: 'Untersuchung der am Schadenort genommenen Proben einschl. Labornebenkosten',
    3: 'Auswertung der Untersuchungsergebnisse sowie Ausarbeitung und Anfertigung eines Sanierungsvorschlags und eines Untersuchungsberichtes',
  };
  const STANDARD = () => ({
    format: 'aufwandkit-einstellungen', version: 1,
    titel: Object.assign({}, TITEL),
    positionen: [
      { key: 'sv1', titel: 1, nr: '1.007', text: 'Sachverständiger', einheit: 'Std.', preis: '145,00' },
      { key: 'pn1', titel: 1, nr: '1.006', text: 'Probenehmer', einheit: 'Std.', preis: '85,00' },
      { key: 'km', titel: 1, nr: '1.004', text: 'Fahrkosten', einheit: 'km', preis: '0,75' },
      { key: 'spesen', titel: 1, nr: '1.005', text: 'Tagesspesen', einheit: 'Tage', preis: '28,00' },
      { key: 'hotel', titel: 1, nr: '1.002', text: 'Übernachtungen', einheit: 'psch', preis: '' },
      { key: 'lab-pak', titel: 2, nr: '2.001', text: 'Analyse(n) auf PAK n. EPA', einheit: '', preis: '95,00' },
      { key: 'lab-chlorid-wisch', titel: 2, nr: '2.008', text: 'Chloridanalyse(n) (Wischproben)', einheit: '', preis: '50,00' },
      { key: 'sv3', titel: 3, nr: '3.001', text: 'Sachverständiger', einheit: 'Std.', preis: '145,00' },
      { key: 'pn3', titel: 3, nr: '', text: 'Probenehmer', einheit: 'Std.', preis: '85,00' },
      { key: 'neben', titel: 3, nr: '3.002', text: 'Schreib-, Versand- und Nebenkosten, Fotos etc.', einheit: 'psch', preis: '' },
    ],
    // Kategorie aus LabelKit → Positionsschlüssel; '-' = nicht abrechnen; fehlt = noch nicht zugeordnet (Hinweis)
    zuordnung: { 'pak-wisch': 'lab-pak', 'pak-material': 'lab-pak', 'chlorid-wisch': 'lab-chlorid-wisch', 'brandgeruch': '-' },
    personen: [{ kuerzel: 'SK', name: 'Sebastian Kasper', rolle: 'Sachverständiger' }],
    saetze: { seite: '', foto: '', pauschale: '' },   // 3.002: € je Berichtsseite, € je Foto, fester Anteil (Versand/Porto)
  });
  /** Gespeicherte Einstellungen mit dem Standard ergänzen (neue feste Positionen erscheinen, Eigenes bleibt). */
  function einstellungen(o){
    const s = STANDARD(); if (!o || typeof o !== 'object') return s;
    const pos = Array.isArray(o.positionen) ? o.positionen.filter(p => p && t(p.key)) : [];
    for (const p of s.positionen) if (!pos.some(x => x.key === p.key)) pos.push(p);
    return Object.assign(s, o, { titel: Object.assign({}, TITEL, o.titel || {}), positionen: pos,
      zuordnung: Object.assign({}, o.zuordnung || s.zuordnung), personen: Array.isArray(o.personen) ? o.personen : s.personen,
      saetze: Object.assign({}, s.saetze, o.saetze || {}) });
  }

  /* ---------- Proben aus LabelKit ----------
     Je Liste eine Analyse; Einteilung wie LabelKits Textbausteine (Wischprobe ↔ Material, DepV-Mischprobe, Parameter der sonstigen Proben). */
  const ASBEST_KEIN_MATERIAL = ['wischprobe', 'wasser', 'luft (raumluft)', 'sonstige'];
  const paramKey = v => [...new Set(str(v).split(/[;,\n+]+/).map(x => x.replace(/\s+/g, ' ').trim().toLocaleLowerCase('de-DE')).filter(Boolean))].sort().join(' + ');
  function kategorien(daten){
    const d = daten && typeof daten === 'object' ? daten : {}, k = new Map();
    /* „ohne Bezeichnung“ wie LabelKits eigene Prüfung: Raum/Ort (z2), bei Bohrkernen die BK-Bezeichnung */
    const bezeichnet = p => p.matrix === 'Bohrkern' ? !!(t(p.bkBez) || t(p.z2) || t(p.z3)) : !!(t(p.z2) || t(p.z3));
    const add = (key, label, p) => { const e = k.get(key) || { key, label, anzahl: 0, ohneBezeichnung: 0 }; e.anzahl++;
      if (p && !bezeichnet(p)) e.ohneBezeichnung++; k.set(key, e); };
    const L = n => Array.isArray(d[n]) ? d[n] : [];
    L('proben').forEach(p => p.matrix === 'Wischprobe' ? add('pak-wisch', 'PAK – Wischproben', p) : add('pak-material', 'PAK – Material' + (t(p.matrix) ? ' (' + t(p.matrix) + ')' : ''), p));
    L('chloridProben').forEach(p => {
      p.matrix === 'Wischprobe' ? add('chlorid-wisch', 'Chlorid – Wischproben', p) : add('chlorid-material', 'Chlorid – Material', p);
      if (p.loeschpulverparameter) add('chlorid-loeschpulver', 'Löschpulverparameter (Ammonium, Sulfat, Orthophosphat)', p);
    });
    L('asbestProben').forEach(p => ASBEST_KEIN_MATERIAL.includes(t(p.matrix).toLocaleLowerCase('de-DE')) || !t(p.matrix)
      ? add('asbest-sonstige', 'Asbest – ' + (t(p.matrix) || 'ohne Matrix'), p) : add('asbest-material', 'Asbest – Materialproben', p));
    L('sonstigeProben').forEach(p => {
      const par = paramKey(p.notiz), misch = /\bmischprobe\b/i.test(str(p.matrix));
      if (!par) return add('sonstige-ohne', 'Sonstige Proben ohne Untersuchungsparameter', p);
      const depv = /\bdepv\b|deponieverordnung/i.test(par);
      add('sonstige:' + par + (depv && misch ? ':misch' : ''), (depv && misch ? 'DepV-Mischprobe – ' : 'Sonstige – ') + t(p.notiz).replace(/\s+/g, ' '), p);
    });

    return [...k.values()];
  }

  /* ---------- Zeiten ---------- */
  const ARTEN = { ort: 'Ortstermin (inkl. Fahrt)', buero: 'Auswertung / Bericht' };
  const ROLLEN = ['Sachverständiger', 'Probenehmer'];
  const rolleKurz = r => r === 'Probenehmer' ? 'pn' : 'sv';
  /** dateien: [{kuerzel, eintraege:[{datum, art, rolle, stunden, km, spesen, hotelAnzahl, hotelBetrag, notiz}]}] */
  function zeiten(dateien){
    const sum = { sv1: 0, pn1: 0, sv3: 0, pn3: 0, km: 0, spesen: 0, hotelAnzahl: 0, hotelBetrag: 0, ortstermine: new Set() }, hinweise = [], kmJeTag = {};
    for (const f of dateien || []) if (f && f.defekt) hinweise.push(`„${t(f.datei) || 'Aufwand_' + t(f.kuerzel) + '.json'}“ ist nicht lesbar – die Zeiten von ${t(f.kuerzel) || '?'} fehlen in der Abrechnung.`);
    for (const f of dateien || []) for (const e of (f.eintraege || [])){
      const wer = t(f.kuerzel) || '?', wann = t(e.datum);
      const n = (feld, label) => { const x = zahl(e[feld]); if (Number.isNaN(x)){ hinweise.push(`${wer} ${datumDe(wann)}: ${label} „${t(e[feld])}“ ist keine Zahl – nicht mitgezählt.`); return 0; } if (x < 0){ hinweise.push(`${wer} ${datumDe(wann)}: ${label} negativ – nicht mitgezählt.`); return 0; } return x; };
      const h = n('stunden', 'Stunden'), km = n('km', 'km'), sp = n('spesen', 'Tagesspesen'), ha = n('hotelAnzahl', 'Übernachtungen'), hb = n('hotelBetrag', 'Betrag Übernachtung');
      const art = e.art === 'buero' ? 3 : 1;
      sum[rolleKurz(e.rolle) + art] += h; sum.km += km; sum.spesen += sp; sum.hotelAnzahl += ha; sum.hotelBetrag += hb;
      if (art === 1 && wann) sum.ortstermine.add(wann);
      if (!wann) hinweise.push(`${wer}: Eintrag ohne Datum.`);
      if (art === 1 && !h) hinweise.push(`${wer} ${datumDe(wann)}: Ortstermin ohne Stunden.`);
      if (art === 3 && (km || sp || ha)) hinweise.push(`${wer} ${datumDe(wann)}: km/Spesen/Übernachtung bei „Auswertung / Bericht“ – gehören zum Ortstermin (Titel 1).`);
      if (ha && !hb) hinweise.push(`${wer} ${datumDe(wann)}: Übernachtung ohne Betrag lt. Beleg.`);
      if (hb && !ha) hinweise.push(`${wer} ${datumDe(wann)}: Betrag Übernachtung ohne Anzahl der Übernachtungen.`);
      if (km && wann) (kmJeTag[wann] = kmJeTag[wann] || new Set()).add(wer);
      if (h > 24) hinweise.push(`${wer} ${datumDe(wann)}: ${fmt(h)} Stunden an einem Eintrag – mehr als ein Tag, bitte prüfen.`);
    }
    for (const [tag, wer] of Object.entries(kmJeTag)) if (wer.size > 1) hinweise.push(`${datumDe(tag)}: km von ${[...wer].join(' und ')} – zwei Fahrzeuge? Bei Fahrgemeinschaft trägt nur der Fahrer km ein.`);
    return { sum, hinweise };
  }
  function datumDe(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(t(iso)); return m ? `${m[3]}.${m[2]}.${m[1]}` : t(iso); }
  /** „am 28.07. und 21.08.2026“ / „am 28.07.2026“ / über Jahresgrenze voll ausgeschrieben. */
  function terminText(daten){
    const d = [...new Set((daten || []).map(t).filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x)))].sort();
    if (!d.length) return '';
    const jahre = new Set(d.map(x => x.slice(0, 4)));
    const teile = d.map((x, i) => jahre.size > 1 || i === d.length - 1 ? datumDe(x) : `${x.slice(8, 10)}.${x.slice(5, 7)}.`);
    return 'am ' + (teile.length === 1 ? teile[0] : teile.slice(0, -1).join(', ') + ' und ' + teile[teile.length - 1]);
  }

  /* ---------- Bericht: Seiten ---------- */
  /** docProps/app.xml → {seiten, woerter}; Word schreibt die Angaben beim Speichern, sie können veraltet sein. */
  function appXml(xml){
    const g = n => { const m = new RegExp('<' + n + '>(\\d+)</' + n + '>').exec(str(xml)); return m ? Number(m[1]) : null; };
    return { seiten: g('Pages'), woerter: g('Words') };
  }
  /** Seitenangabe von Word plausibel? Mehr als ~900 Wörter je Seite deutet auf eine veraltete Angabe. */
  const wordSeitenPlausibel = a => !!a && a.seiten > 0 && !(a.woerter && a.woerter / a.seiten > 900);
  /** PDF: Seitenzahl (Text als latin1). null, wenn nicht sicher bestimmbar (z. B. komprimierte Objektströme).
     Ein PDF, das nachträglich gespeichert wurde (Acrobat, Signatur, Kommentare), hängt geänderte Objekte an – dieselbe Seite steht dann
     mehrfach in der Datei. Darum gilt je Objektnummer nur die letzte Fassung, und vorrangig die Angabe /Count des Seitenbaums aus dem Katalog. */
  function pdfSeiten(text){
    const s = str(text); if (!/^%PDF-/.test(s)) return null;
    const obj = new Map(), re = /(\d+)\s+(\d+)\s+obj\b([\s\S]*?)\bendobj\b/g; let m;
    while ((m = re.exec(s))) obj.set(m[1] + ' ' + m[2], m[3]);
    const ref = (body, name) => { const r = new RegExp('/' + name + '\\s+(\\d+)\\s+(\\d+)\\s+R').exec(str(body)); return r ? r[1] + ' ' + r[2] : null; };
    const roots = [...s.matchAll(/\/Root\s+(\d+)\s+(\d+)\s+R/g)];
    if (roots.length){
      const r = roots[roots.length - 1], kat = obj.get(r[1] + ' ' + r[2]), baum = kat && obj.get(ref(kat, 'Pages'));
      const c = baum && /\/Count\s+(\d+)/.exec(baum);
      if (c && +c[1] > 0) return +c[1];
    }
    let n = 0; for (const body of obj.values()) if (/\/Type\s*\/Page(?![a-zA-Z])/.test(body)) n++;
    return n > 0 ? n : null;
  }

  /* ---------- Abrechnung ---------- */
  /** o: {einstellungen, zeiten:[dateien], kategorien:[...], berichte:[{datei, abrechnen, seiten, fehlt}], fotos:{anzahl, quelle, hinweise},
         labelkit:{pn98, sonstige}, hinweise:[Lesefehler der Quellen]} */
  function abrechnung(o){
    const E = einstellungen(o.einstellungen), P = k => E.positionen.find(p => p.key === k), hinweise = [...(o.hinweise || [])];
    const z = zeiten(o.zeiten); hinweise.push(...z.hinweise);
    const zeilen = { 1: [], 2: [], 3: [] };
    /* extra.preis gesetzt (auch null) = Betrag von hier (Übernachtung lt. Beleg, 3.002 aus den Sätzen); null heißt: kein Betrag, nichts vortäuschen. */
    const zeile = (key, roh, quelle, extra) => {
      const p = P(key); if (!p){ hinweise.push(`Position „${key}“ fehlt in den Einstellungen.`); return; }
      const menge = geld(roh);   // Menge wie angezeigt und kopiert (2 Stellen) – der Vorschaubetrag rechnet mit derselben Menge wie das Rechnungsprogramm
      if (!menge) return;
      if (!t(p.nr)) hinweise.push(`„${p.text}“ (Titel ${p.titel}) hat keine Positionsnummer – bitte in den Einstellungen eintragen.`);
      const eigen = !!extra && 'preis' in extra, preis = eigen ? extra.preis : zahl(p.preis);
      if (!eigen && Number.isNaN(preis)) hinweise.push(`Preis für „${p.text}“ (Titel ${p.titel}) „${t(p.preis)}“ ist keine Zahl – bitte in den Einstellungen ohne Tausenderpunkt eintragen (z. B. 1250,00).`);
      const ok = preis != null && Number.isFinite(preis) && preis !== 0;
      (zeilen[p.titel] || zeilen[3]).push({ key, nr: t(p.nr), text: p.text, menge, einheit: t(p.einheit), preis: ok ? geld(preis) : null, gesamt: ok ? geld(menge * geld(preis)) : null, quelle, zusatz: extra && extra.zusatz || '' });
    };
    const s = z.sum;
    zeile('sv1', s.sv1, 'Zeiten (Ortstermin)'); zeile('pn1', s.pn1, 'Zeiten (Ortstermin)'); zeile('km', s.km, 'Zeiten');
    zeile('spesen', s.spesen, 'Zeiten');
    if (s.hotelAnzahl || s.hotelBetrag) zeile('hotel', 1, 'Zeiten, Betrag lt. Belegen', { preis: s.hotelBetrag ? geld(s.hotelBetrag) : null, zusatz: `${fmt(s.hotelAnzahl)} Übernachtung${s.hotelAnzahl === 1 ? '' : 'en'}` });
    // Labor: Kategorien → Positionen, gleiche Position wird addiert
    const jePos = new Map();
    for (const k of o.kategorien || []){
      const ziel = (E.zuordnung || {})[k.key];
      if (ziel === '-') continue;
      if (!ziel || !P(ziel)){ hinweise.push(`${k.label}: ${k.anzahl} Probe${k.anzahl === 1 ? '' : 'n'} keiner Position zugeordnet – in den Einstellungen zuordnen oder „nicht abrechnen“ wählen.`); continue; }
      const e = jePos.get(ziel) || { menge: 0, teile: [] }; e.menge += k.anzahl; e.teile.push(`${k.anzahl} ${k.label}`); jePos.set(ziel, e);
      if (k.ohneBezeichnung) hinweise.push(`${k.label}: ${k.ohneBezeichnung} Zeile${k.ohneBezeichnung === 1 ? '' : 'n'} in LabelKit ohne Bezeichnung – leere Zeilen?`);
    }
    for (const [key, e] of jePos) zeile(key, e.menge, 'LabelKit: ' + e.teile.join(', '));
    const lk = o.labelkit || {};
    if (lk.pn98 && !lk.sonstige) hinweise.push(`LabelKit: ${lk.pn98} PN-98-Protokoll${lk.pn98 === 1 ? '' : 'e'}, aber keine Proben unter „Sonstige“ – PN-98-Protokolle selbst werden nicht als Analyse gezählt. Sind die Laborproben in LabelKit erfasst?`);
    zeile('sv3', s.sv3, 'Zeiten (Auswertung / Bericht)'); zeile('pn3', s.pn3, 'Zeiten (Auswertung / Bericht)');
    // 3.002: Seiten und Fotos
    for (const b of (o.berichte || []).filter(b => b.abrechnen && b.fehlt)) hinweise.push(`Bericht „${b.datei}“ ist zur Abrechnung angekreuzt, liegt aber nicht mehr in „Mitteilungen“ (umbenannt oder verschoben?) – nicht mitgezählt. Bitte den Bericht unter „Bericht & Fotos“ neu ankreuzen.`);
    const ber = (o.berichte || []).filter(b => b.abrechnen && !b.fehlt);
    let seiten = 0, offen = 0;
    for (const b of ber){ const n = zahl(b.seiten);
      if (!t(b.seiten) || Number.isNaN(n) || n <= 0){ offen++; hinweise.push(`Bericht „${b.datei}“: Seitenzahl noch nicht bestätigt.`); }
      else if (!Number.isInteger(n)){ offen++; hinweise.push(`Bericht „${b.datei}“: Seitenzahl „${t(b.seiten)}“ ist keine ganze Zahl – nicht mitgezählt.`); }
      else seiten += n; }
    if (!ber.length) hinweise.push('Kein Bericht zur Abrechnung ausgewählt (Reiter „Bericht & Fotos“).');
    const fotos = o.fotos && o.fotos.anzahl || 0;
    if (o.fotos && Array.isArray(o.fotos.hinweise)) hinweise.push(...o.fotos.hinweise);
    const sz = E.saetze || {}, ps = zahl(sz.seite), pf = zahl(sz.foto), pp = zahl(sz.pauschale);
    for (const [w, label] of [[ps, '€ je Berichtsseite'], [pf, '€ je Foto'], [pp, 'fester Anteil €']]) if (Number.isNaN(w)) hinweise.push(`Satz „${label}“ ist keine Zahl – bitte in den Einstellungen ohne Tausenderpunkt eintragen.`);
    if (seiten || fotos || offen){
      const quelle = `${seiten} Berichtsseite${seiten === 1 ? '' : 'n'}${offen ? ` (${offen} Bericht${offen === 1 ? '' : 'e'} ohne Seitenzahl)` : ''}, ${fotos} Foto${fotos === 1 ? '' : 's'}`;
      if (!t(sz.seite) && !t(sz.foto) && !t(sz.pauschale)){
        // keine Sätze: fester Preis der Position (falls eingetragen) als Vorschau, sonst Menge ohne Betrag
        if (!t((P('neben') || {}).preis)) hinweise.push('Sätze für 3.002 (€ je Seite / je Foto) fehlen in den Einstellungen – Menge wird ohne Betrag ausgegeben.');
        zeile('neben', 1, quelle);
      } else {
        // Ein Betrag nur, wenn alles feststeht: kein ungültiger Satz, kein fehlender Satz für vorhandene Seiten/Fotos, keine offene Seitenzahl
        const fehlt = [];
        if (seiten && !t(sz.seite)) fehlt.push(`€ je Berichtsseite (${seiten} Seite${seiten === 1 ? '' : 'n'})`);
        if (fotos && !t(sz.foto)) fehlt.push(`€ je Foto (${fotos} Foto${fotos === 1 ? '' : 's'})`);
        if (fehlt.length) hinweise.push(`3.002: Satz ${fehlt.join(' und ')} fehlt in den Einstellungen – kein Betrag. Soll es nichts kosten, „0“ eintragen.`);
        if (offen) hinweise.push(`3.002: ${offen} Bericht${offen === 1 ? '' : 'e'} ohne gültige Seitenzahl – kein Betrag, bis die Seitenzahl bestätigt ist.`);
        const ungueltig = [ps, pf, pp].some(Number.isNaN) || fehlt.length || offen;
        const betrag = ungueltig ? null : geld(geld(ps * seiten) + geld(pf * fotos) + geld(pp));
        zeile('neben', 1, quelle, { preis: betrag || null });
      }
    }
    const titelText = { 1: (E.titel[1] || TITEL[1]) + (z.sum.ortstermine.size ? ' ' + terminText([...z.sum.ortstermine]) : '') + '\nZeitaufwand', 2: E.titel[2] || TITEL[2], 3: E.titel[3] || TITEL[3] };
    const titel = [1, 2, 3].map(n => ({ nr: n, text: titelText[n], zeilen: n === 2 ? zeilen[n].sort((a, b) => a.nr.localeCompare(b.nr, 'de', { numeric: true })) : zeilen[n],   // Titel 1 und 3 in der Reihenfolge der Rechnung
      summe: zeilen[n].every(x => x.gesamt != null) && zeilen[n].length ? geld(zeilen[n].reduce((a, x) => a + x.gesamt, 0)) : null })).filter(x => x.zeilen.length);
    const netto = titel.length && titel.every(x => x.summe != null) ? geld(titel.reduce((a, x) => a + x.summe, 0)) : null;
    return { titel, hinweise: [...new Set(hinweise)], netto, sum: Object.assign({}, s, { ortstermine: [...s.ortstermine].sort() }), seiten, fotos };
  }

  /** Tabulator-getrennt zum Einfügen ins Rechnungsprogramm bzw. Excel: Pos, Text, Menge, Einheit. */
  function tsv(a){
    const z = ['Position\tText\tMenge\tEinheit'];
    for (const ti of a.titel){ z.push(`Titel ${ti.nr}\t${ti.text.replace(/\n/g, ' – ')}\t\t`); for (const x of ti.zeilen) z.push([x.nr, x.text, fmt(x.menge), x.einheit].join('\t')); }
    return z.join('\r\n') + '\r\n';
  }
  /** CSV (Semikolon, für Excel) mit Quelle und Vorschaupreisen. */
  function csv(a, kopf){
    const q = v => { const s = str(v); return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const z = [...(kopf || []).map(x => (Array.isArray(x) ? x : [x]).map(q).join(';')), ['Titel', 'Position', 'Text', 'Menge', 'Einheit', 'Einzelpreis (Vorschau)', 'Gesamt (Vorschau)', 'Herkunft'].join(';')];
    for (const ti of a.titel) for (const x of ti.zeilen) z.push([ti.nr, x.nr, x.text + (x.zusatz ? ' (' + x.zusatz + ')' : ''), fmt(x.menge), x.einheit, x.preis != null ? fmt(x.preis, 2) : '', x.gesamt != null ? fmt(x.gesamt, 2) : '', x.quelle].map(q).join(';'));
    return '﻿' + z.join('\r\n') + '\r\n';
  }
  /** Dateiname für Stände: ERVV-tauglich, datiert, nie überschreibend. */

async function unter(dir, name, anlegen){

async function liesJson(dir, name){
  if (!dir) return null;

}

/** Einen Eintrag einer ZIP-Datei (z. B. docProps/app.xml im .docx) lesen, ohne die ganze Datei zu laden. */
async function zipEintrag(file, gesucht){
  const n = file.size, tailStart = Math.max(0, n - 66000);
  const tail = new DataView(await file.slice(tailStart).arrayBuffer());
  let eocd = -1; for (let i = tail.byteLength - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  if (eocd < 0) return null;
  const cdSize = tail.getUint32(eocd + 12, true), cdOff = tail.getUint32(eocd + 16, true);
  const cd = new DataView(await file.slice(cdOff, cdOff + cdSize).arrayBuffer()), dec = new TextDecoder();
  for (let p = 0; p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50;){
    const meth = cd.getUint16(p + 10, true), cs = cd.getUint32(p + 20, true), nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true), lo = cd.getUint32(p + 42, true);
    const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nl));
    if (name === gesucht){
      const lh = new DataView(await file.slice(lo, lo + 30).arrayBuffer()), start = lo + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
      const roh = file.slice(start, start + cs);
      if (meth === 0) return dec.decode(await roh.arrayBuffer());
      if (meth === 8 && 'DecompressionStream' in window) return dec.decode(await new Response(roh.stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
      return null;
    }
    p += 46 + nl + xl + cl;
  }
  return null;
}

        if (/\.docx$/i.test(h.name)) b.word = AW.appXml(await zipEintrag(f, 'docProps/app.xml').catch(() => null));
        if (/\.pdf$/i.test(h.name)) b.pdf = f.size < 80e6 ? AW.pdfSeiten(new TextDecoder('latin1').decode(await f.arrayBuffer())) : null;

      A.berichte.push(b);
    }
  }
  A.ladeHinweise = quellen;
  if (!aktuell()) return;
  if (fehler.length) meldung('err', fehler.map(esc).join('<br>')); else versteckeMeldung();
  zeichne();
}

/* ---------- Speichern ---------- */
let speichernTimer = null;
function meineGeaendert(){

}
/** Wartende Eingaben sofort schreiben (vor Kürzelwechsel, Projektwechsel und Neu einlesen). */
async function sichereMeine(){

}
async function speichereMeine(){
  if (!A.proj || !AW.kuerzelOk(A.kz)) return;
  if (A.meineDefekt){ status(`„Aufwand_${A.kz.toUpperCase()}.json“ ist nicht lesbar und wird nicht überschrieben.`, 'err'); return; }
  const abr = await unter(A.proj.dir, ORDNER.abr, true), name = `Aufwand_${A.kz.toUpperCase()}.json`;
  await schreibJson(abr, name, { format: 'aufwandkit-zeiten', version: 1, hinweis: 'Zeiten, km und Spesen einer Person für dieses Projekt (BelegKit). Jede Person schreibt nur ihre eigene Datei.',

  if (f) f.eintraege = A.meine.map(x => Object.assign({}, x)); else A.alle.push({ kuerzel: A.kz.toUpperCase(), datei: name, eintraege: A.meine.map(x => Object.assign({}, x)) });

/** Projektdatei: frisch lesen, nur die Berichtsangabe ändern, schreiben (wie _Projekt.json). */
async function speichereBericht(stamm, patch){
  if (A.pdateiGesperrt){ status(`„${PROJ_DATEI}“ ist nicht lesbar und wird nicht überschrieben.`, 'err'); return; }
  const abr = await unter(A.proj.dir, ORDNER.abr, true), cur = await liesJson(abr, PROJ_DATEI);
  const o = Object.assign({ format: 'aufwandkit-projekt', version: 1, hinweis: 'Angaben zur Abrechnung dieses Projekts (BelegKit). Bitte nicht löschen.', berichte: {} }, cur && cur.daten);
  o.berichte = Object.assign({}, o.berichte); o.berichte[stamm] = Object.assign({}, o.berichte[stamm], patch, { geaendert: new Date().toISOString(), von: A.kz.toUpperCase() });
  o.geaendert = new Date().toISOString(); o.geaendertMit = APP_NAME + ' ' + APP_VERSION;

/** Zuordnung einer Probenart: Datei frisch lesen, nur diesen Eintrag ändern, schreiben – so gehen Preise oder Zuordnungen,
   die ein Kollege inzwischen gespeichert hat, nicht verloren (bisher wurde der ganze beim Öffnen gelesene Stand zurückgeschrieben). */
async function speichereZuordnung(kat, wert){
  if (A.einstGesperrt){ status(`„${EINST_DATEI}“ ist nicht lesbar und wird nicht überschrieben.`, 'err'); return; }
  const cur = await liesJson(A.archiv, EINST_DATEI);
  if (!cur){ await speichereEinst(); return; }   // noch keine Datei: der ganze Stand wird angelegt
  const o = Object.assign({}, cur.daten, { zuordnung: Object.assign({}, cur.daten.zuordnung || AW.STANDARD().zuordnung) });
  if (wert) o.zuordnung[kat] = wert; else delete o.zuordnung[kat];
  Object.assign(o, { geaendert: new Date().toISOString(), geaendertVon: A.kz.toUpperCase(), geaendertMit: APP_NAME + ' ' + APP_VERSION });
  await schreibJson(A.archiv, EINST_DATEI, o);
  // Stand nur fortschreiben, wenn vorher niemand dazwischen gespeichert hat – sonst warnt „Einstellungen speichern“ später zu Recht
  if ((cur.daten.geaendert || null) === (A.einstStand || null)) A.einstStand = o.geaendert;
  A.einstAusDatei = true; A.einstGeaendert = o;
  status('✓ Zuordnung gespeichert (gilt für alle Projekte)', 'ok');
}
async function speichereEinst(){
  if (A.einstGesperrt){ status(`„${EINST_DATEI}“ ist nicht lesbar und wird nicht überschrieben.`, 'err'); return false; }
  // Hat jemand die Einstellungen seit dem Einlesen gespeichert? Dann nicht still überschreiben.
  const cur = await liesJson(A.archiv, EINST_DATEI), stand = cur && cur.daten && cur.daten.geaendert || null;
  if (stand && stand !== (A.einstStand || null) && !confirm(`Die Einstellungen wurden inzwischen gespeichert${cur.daten.geaendertVon && cur.daten.geaendertVon !== A.kz.toUpperCase() ? ' von ' + cur.daten.geaendertVon : ''} (${zeitDe(stand)}).\n\nTrotzdem mit Ihrem Stand überschreiben? Abbrechen und „Neu einlesen“ zeigt den neuen Stand.`)) return false;
  const o = Object.assign({}, A.einst, { format: 'aufwandkit-einstellungen', version: 1, hinweis: 'Positionen und Sätze für BelegKit – gilt für alle Projekte und alle Kollegen. Bitte nicht löschen.',
    geaendert: new Date().toISOString(), geaendertVon: A.kz.toUpperCase(), geaendertMit: APP_NAME + ' ' + APP_VERSION });
  await schreibJson(A.archiv, EINST_DATEI, o); A.einstAusDatei = true; A.einstGeaendert = o; A.einstStand = o.geaendert;
  status(`✓ Einstellungen gespeichert („${EINST_DATEI}“ im Archivordner)`, 'ok'); return true;
}

/* ---------- Route in Google Maps (1.4) ----------
   Öffnet Google Maps in einem eigenen Fenster mit Start → Objekt (→ Start). BelegKit selbst verbindet sich mit keinem

const START_STANDARD = 'Gouleystraße 59, 52146 Würselen';

const MAPS_LINK = /^https:\/\/((www\.)?google\.[a-z]{2,3}(\.[a-z]{2})?\/maps[/?]|maps\.google\.[a-z]{2,3}(\.[a-z]{2})?\/|maps\.app\.goo\.gl\/|goo\.gl\/maps\/)/i;

  window.open(url, '_blank', `noopener,noreferrer,popup,width=${w},height=${sh},left=${sw - w},top=0`);
}

/** Stand ablegen: JSON (vollständig, mit SHA-256 jeder Quelle) und CSV, beide nie überschreibend. */
async function standSpeichern(a){
  if (!AW.kuerzelOk(A.kz)){ status('Bitte oben Ihr Kürzel eintragen.', 'err'); return; }
  status('… Prüfsummen werden berechnet');
  const quellen = [], hash = async (pfad, file) => quellen.push({ datei: pfad, bytes: file.size, geaendert: new Date(file.lastModified).toISOString(), sha256: await sha256Hex(await file.arrayBuffer()) });
  const abr = await unter(A.proj.dir, ORDNER.abr, true);
  try{ await hash('_Projekt.json', await (await A.proj.dir.getFileHandle('_Projekt.json')).getFile()); }catch(e){}   // Projektdaten, aus denen Objekt/Auftraggeber/Schaden-Nr. stammen
  for await (const h of abr.values()) if (h.kind === 'file' && (/^Aufwand_.*\.json$/.test(h.name) || h.name === PROJ_DATEI)) await hash(ORDNER.abr + '/' + h.name, await h.getFile());
  if (A.labelkit) await hash(ORDNER.lab + '/' + A.labelkit.datei.name, A.labelkit.datei);
  const fo = await unter(A.proj.dir, ORDNER.fotos, false); if (fo) try{ await hash(ORDNER.fotos + '/_Bildumbenenner.json', await (await fo.getFileHandle('_Bildumbenenner.json')).getFile()); }catch(e){}
  const mi = await unter(A.proj.dir, ORDNER.mitteil, false), pb = A.pdatei.berichte || {};
  if (mi) for (const b of A.berichte.filter(x => (pb[x.stamm] || {}).abrechnen)) for (const n of b.dateien) await hash(ORDNER.mitteil + '/' + n, await (await mi.getFileHandle(n)).getFile());
  try{ await hash(EINST_DATEI + ' (Archivordner)', await (await A.archiv.getFileHandle(EINST_DATEI)).getFile()); }catch(e){}
  const namen = []; for await (const h of abr.values()) namen.push(h.name);
  const gibtEs = async n => { try{ await abr.getFileHandle(n); return true; }catch(e){ return false; } };
  let json, csvName;
  for (;;){   // nie überschreiben – auch nicht, wenn die Ordnerliste veraltet ist
    json = AW.dateiname(A.proj.nr, 'Aufwand', heuteIso(), 'json', namen); csvName = json.replace(/\.json$/, '.csv');
    if (!(await gibtEs(json)) && !(await gibtEs(csvName))) break;
    namen.push(json, csvName);
  }
  const jetzt = new Date().toISOString();
  await schreibJson(abr, json, { format: 'aufwandkit-stand', version: 1, projekt: A.proj.name, erstellt: jetzt, von: A.kz.toUpperCase(), programm: APP_NAME + ' ' + APP_VERSION,
    projektdaten: projektdaten(), titel: a.titel, hinweise: a.hinweise, netto: a.netto, seiten: a.seiten, fotos: a.fotos, ortstermine: a.sum.ortstermine, quellen });
  const w = await (await abr.getFileHandle(csvName, { create: true })).createWritable();
  await w.write(AW.csv(a, [['Projekt', A.proj.name], ...[['Objekt', projektdaten().objekt], ['Auftraggeber', projektdaten().auftraggeber], ['Schaden-Nr. des Auftraggebers', projektdaten().schadennummer]].filter(x => x[1]), ['Stand', `${zeitDe(jetzt)} (${A.kz.toUpperCase()}, ${APP_NAME} ${APP_VERSION})`], ['']])); await w.close();
  status(`✓ Stand gespeichert: „${ORDNER.abr}/${json}“ und „${csvName}“`, 'ok');
}

    return idb().then(function(db){ return new Promise(function(res){
      if (!db) return res(false);
      try{ var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(val, key); t.oncomplete = function(){ db.close(); res(true); }; t.onerror = t.onabort = function(){ db.close(); res(false); }; }
      catch(e){ res(false); }
    }); });
  }
  function urlName(){ try{ return new URLSearchParams(location.search).get('projekt') || ''; }catch(e){ return ''; } }
  function href(app, projekt){ return (app[0] === ich ? '' : app[3]) + (projekt ? '?projekt=' + encodeURIComponent(projekt) : ''); }   // die eigene App relativ zur aktuellen Seite (auch ohne den Pfad /<App>/)

  /* Ordnerstand: nur Namen prüfen, Fotos nur über die eine Datei (der Ordner kann tausende Bilder enthalten) */
  function unterordner(proj, wunsch){
    var w = nfc(wunsch).toLowerCase();
    return (async function(){
      for await (var e of proj.values()) if (e.kind === 'directory' && nfc(e.name).toLowerCase() === w) return e;
      return null;
    })();
  }
  async function ordnerStand(){
    var arch = await kvGet('archiv');
    if (!arch || !arch.queryPermission) return null;
    if ((await arch.queryPermission({ mode: 'read' })) !== 'granted') return null;
    var proj = null;
    try{ proj = await arch.getDirectoryHandle(name); }catch(e){}
    if (!proj){
      try{ for await (var e of arch.values()) if (e.kind === 'directory' && nfc(e.name) === nfc(name)){ proj = e; break; } }catch(e2){}
    }
    if (!proj) return null;
    var s = { label: false, fotos: false, plan: false, beleg: false, objekt: '' };
    try{
      var pj = await proj.getFileHandle('_Projekt.json').then(function(f){ return f.getFile(); }).then(function(f){ return f.text(); }).catch(function(){ return ''; });
      if (pj){ var j = JSON.parse(pj), o = j && (typeof j.objekt === 'string' ? j.objekt : j.daten && j.daten.objekt); if (typeof o === 'string') s.objekt = o.trim(); }   // Projektzentrale schreibt die Felder direkt in _Projekt.json (ältere Testdateien: unter „daten“)
    }catch(e3){}
    try{ var fo = await unterordner(proj, 'Fotos'); if (fo) s.fotos = await fo.getFileHandle('_Bildumbenenner.json').then(function(){ return true; }, function(){ return false; }); }catch(e4){}
    try{
      var la = await unterordner(proj, 'Laboraufträge');
      if (la) for await (var f of la.values()) if (f.kind === 'file' && /_Daten\.json$/i.test(f.name)){ s.label = true; break; }
    }catch(e5){}
    try{
      var pl = await unterordner(proj, 'Pläne');
      if (pl) for await (var g of pl.values()) if (g.kind === 'file' && /\.probenplan$/i.test(g.name) && !/ \((vorher|Wiederherstellung) [^)]*\)\.probenplan$/i.test(g.name)){ s.plan = true; break; }
    }catch(e6){}
    try{
      var ab = await unterordner(proj, 'Abrechnung');
      if (ab) for await (var k of ab.values()) if (k.kind === 'file' && /_Aufwand_.*\.json$/i.test(k.name)){ s.beleg = true; break; }
    }catch(e7){}
    return s;
  }
  function naechster(){
    if (!stand) return null;
    var i0 = APPS.findIndex(function(a){ return a[0] === ich; }), n = APPS.length;
    for (var d = 1; d < n; d++){ var a = APPS[(i0 + d) % n]; if ((i0 + d) < n && !stand[a[0]]) return a; }   // zuerst ein späterer Schritt …
    for (var e = 1; e < n; e++){ var b = APPS[(i0 + e) % n]; if ((i0 + e) >= n && !stand[b[0]]) return b; }   // … sonst der erste offene davor
    return null;
  }
  function css(){
    if (document.getElementById('mosaikLeisteCss')) return;
    var st = h('style', { id: 'mosaikLeisteCss' });
    st.textContent =
            '#mosaikLeiste{position:relative;flex:none;box-sizing:border-box;width:100%;height:36px;z-index:2147483000;display:flex;align-items:center;gap:6px;padding:0 10px;background:#17222c;color:#e8eef3;font:12.5px/1 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 1px 6px rgba(0,0,0,.25);white-space:nowrap}' +
      '#mosaikLeiste a,#mosaikLeiste button{font:inherit;color:inherit;text-decoration:none;border:0;background:none;cursor:pointer;padding:0;margin:0;min-height:0;border-radius:6px;box-shadow:none}' +
      '#mosaikLeiste .ml-home,#mosaikLeiste .ml-proj{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;color:#c9d6df}' +
      '#mosaikLeiste .ml-home:hover,#mosaikLeiste .ml-proj:hover,#mosaikLeiste .ml-proj[aria-expanded=true]{background:rgba(255,255,255,.1);color:#fff}' +
      '#mosaikLeiste .ml-marke{flex:none;padding:0 6px 0 2px;color:#8fb3d1;font-weight:700;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}' +
      '#mosaikLeiste .ml-proj b{color:#fff;font-weight:650}#mosaikLeiste .ml-obj{color:#9fb1be;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto;max-width:34ch}' +

      '#mosaikLeiste .ml-step{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;color:#b9c8d3;position:relative}' +
      '#mosaikLeiste a.ml-step:hover{background:rgba(255,255,255,.1);color:#fff}' +
      '#mosaikLeiste .ml-step i{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;font:700 9.5px/1 inherit;font-style:normal;border:1.5px solid var(--ac);color:var(--ac)}' +
      '#mosaikLeiste .ml-step.done i{background:var(--ac);color:#0f1820}' +
      '#mosaikLeiste .ml-step.next i{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}' +
      '#mosaikLeiste .ml-step.hier{background:rgba(255,255,255,.14);color:#fff;font-weight:650;cursor:default}' +
      '#mosaikLeiste .ml-weiter{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;background:var(--ac);color:#fff;font-weight:650}' +
      '#mosaikLeiste .ml-weiter:hover{filter:brightness(1.12)}' +
      '#mosaikLeiste .ml-hinweis{color:#9fb1be}' +
      '#mosaikLeistePop{position:fixed;top:40px;left:8px;z-index:2147483001;min-width:260px;max-width:min(92vw,420px);background:#fff;color:#1b2a35;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:6px;font:13px/1.35 "Segoe UI",system-ui,-apple-system,Arial,sans-serif}' +
      '#mosaikLeistePop h6{margin:6px 10px 4px;font:600 10.5px/1 inherit;letter-spacing:.06em;text-transform:uppercase;color:#6a7c89}' +
      '#mosaikLeistePop a{display:block;padding:8px 10px;border-radius:7px;color:inherit;text-decoration:none}#mosaikLeistePop a:hover,#mosaikLeistePop a:focus-visible{background:#eaf1f6;outline:0}' +
      '#mosaikLeistePop a.aktuell{font-weight:650;background:#f2f6f9}#mosaikLeistePop hr{border:0;border-top:1px solid #e2e9ee;margin:5px 4px}' +
      '#mosaikLeiste.ml-kompakt{height:24px;font-size:12px;padding:0 8px}#mosaikLeiste.ml-kompakt .ml-home,#mosaikLeiste.ml-kompakt .ml-proj,#mosaikLeiste.ml-kompakt .ml-step,#mosaikLeiste.ml-kompakt .ml-weiter{height:20px;padding:0 7px}#mosaikLeiste.ml-kompakt .ml-step i{width:14px;height:14px;font-size:9px}#mosaikLeistePop{top:30px}' +
      '@media (max-width:860px){#mosaikLeiste .ml-marke,#mosaikLeiste .ml-obj,#mosaikLeiste .ml-step span{display:none}#mosaikLeiste .ml-step.hier span{display:inline}}' +
      '@media (max-width:560px){#mosaikLeiste .ml-home span,#mosaikLeiste .ml-weiter span{display:none}#mosaikLeiste .ml-step.hier span{display:none}}' +
      '@media print{#mosaikLeiste,#mosaikLeistePop{display:none!important}}';
    document.head.appendChild(st);
  }
  function schliessePop(){ if (pop){ pop.remove(); pop = null; } var b = bar && bar.querySelector('.ml-proj'); if (b) b.setAttribute('aria-expanded', 'false'); }
  function oeffnePop(btn){
    if (pop) return schliessePop();
    pop = h('div', { id: 'mosaikLeistePop', role: 'menu' });
    var app = APPS.filter(function(a){ return a[0] === ich; })[0];
    var rest = zuletzt.filter(function(n){ return nfc(n) !== nfc(name); });
    if (name) pop.appendChild(h('h6', { text: 'Aktuelles Projekt' })), pop.appendChild(h('a', { class: 'aktuell', href: href(app, name), text: name, role: 'menuitem' }));
    if (rest.length){ pop.appendChild(h('h6', { text: 'Zuletzt geöffnet' })); rest.forEach(function(n){ pop.appendChild(h('a', { href: href(app, n), text: n, role: 'menuitem' })); }); }
    pop.appendChild(h('hr'));
    pop.appendChild(h('a', { href: ZENTRALE, target: 'projektzentrale', text: 'Alle Projekte … (Projektzentrale)', role: 'menuitem' }));
    document.body.appendChild(pop);
    var r = btn.getBoundingClientRect(); pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px'; pop.style.top = (r.bottom + 4) + 'px';
    btn.setAttribute('aria-expanded', 'true');
    var erste = pop.querySelector('a'); if (erste) erste.focus();
  }
  function zeichne(){
    css();
    if (!bar){
      bar = h('div', { id: 'mosaikLeiste', class: kompakt ? 'ml-kompakt' : '', role: 'navigation', 'aria-label': 'Projekt und Arbeitsschritte' });
      document.body.insertBefore(bar, document.body.firstChild);
    }
    schliessePop();
    bar.textContent = '';
    var app = APPS.filter(function(a){ return a[0] === ich; })[0] || APPS[0];
    bar.style.setProperty('--ac', app[4]);
    bar.appendChild(h('span', { class: 'ml-marke', title: 'Spektron – die Büro-Apps', text: 'Spektron' }));
    bar.appendChild(h('a', { class: 'ml-home', href: ZENTRALE, target: 'projektzentrale', title: 'Alle Projekte (Projektzentrale)' }, h('b', { text: '⌂', 'aria-hidden': 'true' }), h('span', { text: 'Projektzentrale' })));
    if (name){
      var pb = h('button', { class: 'ml-proj', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false', title: 'Anderes Projekt öffnen' }, h('b', { text: name }), h('span', { text: '▾', 'aria-hidden': 'true' }));
      pb.onclick = function(ev){ ev.stopPropagation(); oeffnePop(pb); };
      bar.appendChild(pb);
      if (stand && stand.objekt) bar.appendChild(h('span', { class: 'ml-obj', text: stand.objekt, title: stand.objekt }));
      bar.appendChild(h('span', { class: 'ml-sp' }));
      var steps = h('span', { class: 'ml-steps' });
      var nx = naechster();
      APPS.forEach(function(a, i){
        var done = !!(stand && stand[a[0]]), cls = 'ml-step' + (done ? ' done' : '') + (nx && nx[0] === a[0] ? ' next' : '') + (a[0] === ich ? ' hier' : '');
        var ic = h('i', { text: done ? '✓' : String(i + 1), 'aria-hidden': 'true' }), sp = h('span', { text: a[1] });
        var t = a[1] + (done ? ' – erledigt' : '') + (a[0] === ich ? ' (diese App)' : '');
        var el = a[0] === ich ? h('span', { class: cls, 'aria-current': 'page', title: t }, ic, sp) : h('a', { class: cls, href: href(a, name), target: a[2], title: t }, ic, sp);
        el.style.setProperty('--ac', a[4]); steps.appendChild(el);
      });
      bar.appendChild(steps);
      if (nx){
        var w = h('a', { class: 'ml-weiter', href: href(nx, name), target: nx[2], title: 'Nächster offener Schritt dieses Projekts' }, h('span', { text: 'Weiter: ' + nx[1] }), h('b', { text: '→', 'aria-hidden': 'true' }));
        w.style.setProperty('--ac', nx[4]); bar.appendChild(w);
      }
    }else{
      var l = zuletzt[0];
      bar.appendChild(h('span', { class: 'ml-hinweis', text: l ? 'Kein Projekt geöffnet.' : 'Projekte öffnen Sie über die Projektzentrale.' }));
      if (l){
        var wl = h('a', { class: 'ml-weiter', href: href(app, l), title: 'Öffnet dieses Projekt in dieser App' }, h('span', { text: 'Weiter mit ' + l }), h('b', { text: '→', 'aria-hidden': 'true' }));
        wl.style.setProperty('--ac', app[4]); bar.appendChild(wl);
      }
      bar.appendChild(h('span', { class: 'ml-sp' }));
      if (zuletzt.length > 1){
        var an = h('button', { class: 'ml-proj', type: 'button', 'aria-haspopup': 'menu', 'aria-expanded': 'false' }, h('span', { text: 'Anderes Projekt' }), h('span', { text: '▾', 'aria-hidden': 'true' }));
        an.onclick = function(ev){ ev.stopPropagation(); oeffnePop(an); }; bar.appendChild(an);
      }
    }
  }
  async function aktualisieren(){
    if (pop) return;   // Menü offen: nicht neu zeichnen (würde es schließen); der nächste Durchlauf holt das nach
    var mein = ++lauf, n = urlName();
    if (n !== name){ name = n; stand = null; }
    try{ zuletzt = (await kvGet('zuletzt')) || []; if (!Array.isArray(zuletzt)) zuletzt = []; }catch(e){ zuletzt = []; }
    if (name && nfc(zuletzt[0] || '') !== nfc(name)){
      zuletzt = [name].concat(zuletzt.filter(function(x){ return nfc(x) !== nfc(name); })).slice(0, MAX);
      kvSet('zuletzt', zuletzt);
    }
    if (mein !== lauf) return;
    zeichne();
    if (!name) return;
    var s = null; try{ s = await ordnerStand(); }catch(e){ s = null; }
    if (mein !== lauf) return;
    var alt = JSON.stringify(stand); stand = s;
    if (JSON.stringify(s) !== alt) zeichne();
  }
  function start(appId, opt){
    ich = appId; kompakt = !!(opt && opt.kompakt);
    var los = function(){
      aktualisieren();
      window.addEventListener('focus', aktualisieren);
      document.addEventListener('visibilitychange', function(){ if (!document.hidden) aktualisieren(); });
      window.addEventListener('popstate', aktualisieren);
      document.addEventListener('click', function(ev){ if (pop && !pop.contains(ev.target)) schliessePop(); });
      document.addEventListener('keydown', function(ev){ if (ev.key === 'Escape' && pop){ var b = bar.querySelector('.ml-proj'); schliessePop(); if (b) b.focus(); } });
      timer = setInterval(function(){ if (!document.hidden) aktualisieren(); }, 20000);
    };
    if (document.body) los(); else document.addEventListener('DOMContentLoaded', los);
  }
  window.MosaikLeiste = { start: start, aktualisieren: aktualisieren };
})();
/* ===== Ende MOSAIK-LEISTE v1 ===== */
MosaikLeiste.start('beleg');
