name: F4 Spektron integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: f4-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: beleg
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: kaspersebastian83-dot/Projektzentrale
          ref: 4716c0b57284bdf3a0dcdb657bb99059bbf7da77
          path: central
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify harness provenance and pin this F4 head in temporary test manifest
        working-directory: central
        env:
          F4_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --test tests/integration/provenance.test.mjs
          node -e "const fs=require('fs'),p='tests/integration/stand.json',m=JSON.parse(fs.readFileSync(p));if(!/^[a-f0-9]{40}$/.test(process.env.F4_SHA))throw Error('Invalid F4 SHA');m.aufwandkit=process.env.F4_SHA;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"
          node tests/integration/prepare.mjs
          cmp ../beleg/index.html tests/.integration-work/aufwandkit/index.html
          cmp ../beleg/time-store.js tests/.integration-work/aufwandkit/time-store.js
      - name: Pinned browser runtime
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Full existing Spektron producer/consumer and security suite with BelegKit F4
        working-directory: central
        run: node tests/integration/run.mjs --security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f4-spektron-integration-results
          path: |
            central/tests/integration/results/
            central/tests/integration/stand.json
          if-no-files-found: warn
          retention-days: 14
