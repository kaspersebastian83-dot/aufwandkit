name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    name: Node tests (no browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Projektzentrale daneben holen (spektron-ordner.js byte-gleich prüfen)
        env:
          ZWEIG: ${{ github.head_ref }}
        # gleichnamiger Zweig in der Projektzentrale, falls es ihn gibt (Änderung in mehreren Repos), sonst main
        run: git clone --quiet --depth 1 --branch "$ZWEIG" https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale 2>/dev/null || git clone --quiet --depth 1 https://github.com/kaspersebastian83-dot/projektzentrale.git ../projektzentrale
      - run: node tests/spektron-ordner.cjs
        env:
          SPEKTRON_ORDNER_PFLICHT: '1'
      - run: node tests/logik.cjs
      - run: node tests/f4.cjs
      - run: node tests/einlesen.cjs
      - run: node tests/ordnername.cjs
      - run: node tests/hilfe-links.cjs

  browser-tests:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright (pinned, not part of the repository)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${{ matrix.browser }}
      - name: BelegKit in the real browser
        run: node tests/browser.cjs ${{ matrix.browser }}
      - name: Mosaik bar (project, steps, next step) in the real browser
        run: node tests/leiste-browser.cjs ${{ matrix.browser }}
      - name: F4 independent sessions, deterministic final-check races and recovery UI
        run: node tests/f4-browser.cjs ${{ matrix.browser }}
      - name: Place without staff code and „Ihr Kürzel“ from the Projektzentrale
        run: node tests/ort-kuerzel-browser.cjs ${{ matrix.browser }}
