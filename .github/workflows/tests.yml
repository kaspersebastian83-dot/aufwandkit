name: Automated tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node and Chromium tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node tests/logik.cjs
      - run: node tests/f4.cjs
      - name: Install existing pinned Playwright runtime (Chromium only)
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: BelegKit core workflow and saved file formats
        run: node tests/browser.cjs chromium
      - name: Project navigation and cancelled project changes
        run: node tests/leiste-browser.cjs chromium
      - name: Independent sessions, save conflicts and recovery
        run: node tests/f4-browser.cjs chromium
